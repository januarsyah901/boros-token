version: '3.8'

services:
  boros-token:
    build: .
    container_name: boros-token
    ports:
      - "4000:4000"
    restart: unless-stopped
    volumes:
      # Mount databases to persist logs and state
      - ./boros.db:/usr/src/app/boros.db
      - ./history_log.json:/usr/src/app/history_log.json
      # Mount CLI agent databases and logs as read-only to /root
      - ~/.codex:/root/.codex:ro
      - ~/.local/share/opencode:/root/.local/share/opencode:ro
      - ~/.claude:/root/.claude:ro
      - ~/.gemini:/root/.gemini:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
